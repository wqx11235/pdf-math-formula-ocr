<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" width="980" height="430" role="img" aria-label="pmocr 模块依赖图">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/>
    </marker>
  </defs>
  <rect width="980" height="430" fill="#ffffff"/>
  <text x="30" y="32" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="19" font-weight="600" fill="#1f2328">模块依赖：单向、无环，入口只做装配</text>
  <text x="30" y="53" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5" fill="#57606a">箭头 = import 方向。下游不知道上游存在；换打分器只改 jev，换渲染器只改 latex。</text>

  <g font-family="Segoe UI, Microsoft YaHei, sans-serif" text-anchor="middle">
    <rect x="400" y="74" width="170" height="48" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="485" y="96" font-size="14" font-weight="600" fill="#1f2328">cli</text>
    <text x="485" y="113" font-size="11" fill="#57606a">参数 → 装配 → 调用</text>

    <rect x="400" y="152" width="170" height="48" rx="8" fill="#ddf4ff" stroke="#54aeff"/>
    <text x="485" y="174" font-size="14" font-weight="600" fill="#0a3069">qc</text>
    <text x="485" y="191" font-size="11" fill="#0a3069">编排 + 四类判定</text>

    <rect x="120" y="240" width="150" height="48" rx="8" fill="#ffffff" stroke="#8c959f"/>
    <text x="195" y="262" font-size="13.5" font-weight="600" fill="#1f2328">latex</text>
    <text x="195" y="279" font-size="11" fill="#57606a">xelatex → PNG</text>

    <rect x="300" y="240" width="150" height="48" rx="8" fill="#ffffff" stroke="#8c959f"/>
    <text x="375" y="262" font-size="13.5" font-weight="600" fill="#1f2328">jev</text>
    <text x="375" y="279" font-size="11" fill="#57606a">打分 + 重试</text>

    <rect x="480" y="240" width="150" height="48" rx="8" fill="#ffffff" stroke="#8c959f"/>
    <text x="555" y="262" font-size="13.5" font-weight="600" fill="#1f2328">ocr</text>
    <text x="555" y="279" font-size="11" fill="#57606a">读块级 JSON</text>

    <rect x="660" y="240" width="150" height="48" rx="8" fill="#ffffff" stroke="#8c959f"/>
    <text x="735" y="262" font-size="13.5" font-weight="600" fill="#1f2328">paths</text>
    <text x="735" y="279" font-size="11" fill="#57606a">发现 / 目录 / 命名</text>

    <rect x="120" y="330" width="150" height="44" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="195" y="350" font-size="13" font-weight="600" fill="#1f2328">geometry</text>
    <text x="195" y="366" font-size="10.5" fill="#57606a">bbox 换算（纯计算）</text>

    <rect x="300" y="330" width="150" height="44" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="375" y="350" font-size="13" font-weight="600" fill="#1f2328">config</text>
    <text x="375" y="366" font-size="10.5" fill="#57606a">默认 &lt; 文件 &lt; 环境 &lt; 命令行</text>

    <rect x="480" y="330" width="150" height="44" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="555" y="350" font-size="13" font-weight="600" fill="#1f2328">errors</text>
    <text x="555" y="366" font-size="10.5" fill="#57606a">异常分层</text>

    <rect x="660" y="330" width="150" height="44" rx="8" fill="#dafbe1" stroke="#4ac26b"/>
    <text x="735" y="350" font-size="13" font-weight="600" fill="#04430f">report</text>
    <text x="735" y="366" font-size="10.5" fill="#04430f">CSV / Markdown</text>

    <rect x="830" y="330" width="120" height="44" rx="8" fill="#dafbe1" stroke="#4ac26b"/>
    <text x="890" y="350" font-size="13" font-weight="600" fill="#04430f">experiment</text>
    <text x="890" y="366" font-size="10.5" fill="#04430f">三臂 / 阈值</text>

    <rect x="830" y="240" width="120" height="48" rx="8" fill="#ddf4ff" stroke="#54aeff"/>
    <text x="890" y="262" font-size="13" font-weight="600" fill="#0a3069">render</text>
    <text x="890" y="279" font-size="10.5" fill="#0a3069">PDF → 页图</text>

    <rect x="660" y="152" width="150" height="48" rx="8" fill="#ddf4ff" stroke="#54aeff"/>
    <text x="735" y="174" font-size="14" font-weight="600" fill="#0a3069">merge</text>
    <text x="735" y="191" font-size="11" fill="#0a3069">页 md → 成稿</text>
  </g>

  <g stroke="#8c959f" stroke-width="1.3" fill="none" marker-end="url(#a2)">
    <path d="M485 124 L485 148"/>
    <path d="M430 202 L215 236"/>
    <path d="M462 202 L390 236"/>
    <path d="M505 202 L540 236"/>
    <path d="M540 202 L715 236"/>
    <path d="M215 290 L200 326"/>
    <path d="M195 290 L370 326"/>
    <path d="M390 290 L380 326"/>
    <path d="M555 290 L550 326"/>
    <path d="M735 290 L735 326"/>
    <path d="M735 326 L880 374"/>
    <path d="M735 202 L880 236"/>
  </g>

  <g font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#57606a">
    <text x="30" y="408">实验与复核共用一套数据结构（BlockResult），所以实验能离线重算，不重跑 OCR。</text>
  </g>
</svg>
