<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 372" width="980" height="372" role="img" aria-label="对照组：三种做法的人工成本">
  <rect width="980" height="372" fill="#ffffff"/>
  <text x="30" y="32" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="19" font-weight="600" fill="#1f2328">对照组：同样 3,382 块，三种做法的人工成本</text>
  <text x="30" y="53" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5" fill="#57606a">横条 = 必须人看的比例。Jev 把 100% 压到 34.3%，但其中 23.4 个点是「没拿到信号」，不是被判为错。</text>

  <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <g stroke="#d0d7de" stroke-width="1">
      <line x1="300" y1="84" x2="300" y2="316"/>
      <line x1="620" y1="84" x2="620" y2="316"/>
      <line x1="940" y1="84" x2="940" y2="316"/>
    </g>
    <g font-size="11.5" fill="#8c959f" text-anchor="middle">
      <text x="300" y="330">0%</text>
      <text x="620" y="330">50%</text>
      <text x="940" y="330">100%</text>
    </g>

    <text x="30" y="108" font-size="13" font-weight="600" fill="#1f2328">全人工逐块看</text>
    <rect x="300" y="92" width="640" height="26" rx="4" fill="#afb8c1"/>
    <text x="936" y="110" font-size="12" text-anchor="end" fill="#ffffff">100%</text>

    <text x="30" y="168" font-size="13" font-weight="600" fill="#1f2328">编译 + Jev</text>
    <rect x="300" y="152" width="69.8" height="26" fill="#0969da"/>
    <rect x="369.8" y="152" width="96.6" height="26" fill="#d4a72c"/>
    <rect x="466.4" y="152" width="53.1" height="26" fill="#afb8c1"/>
    <text x="530" y="170" font-size="12" fill="#1f2328">34.3%</text>

    <text x="30" y="228" font-size="13" font-weight="600" fill="#1f2328">只做编译检查</text>
    <rect x="300" y="212" width="96.6" height="26" fill="#d4a72c"/>
    <text x="402" y="230" font-size="12" fill="#1f2328">15.1%</text>

    <text x="30" y="288" font-size="13" font-weight="600" fill="#1f2328">无复核</text>
    <rect x="300" y="272" width="2" height="26" fill="#afb8c1"/>
    <text x="308" y="290" font-size="12" fill="#82071e">0% 人看，但错误直接出版</text>
  </g>

  <g font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#57606a">
    <rect x="30" y="344" width="11" height="11" fill="#0969da"/>
    <text x="47" y="354">Jev 判可疑 10.9%</text>
    <rect x="190" y="344" width="11" height="11" fill="#d4a72c"/>
    <text x="207" y="354">编不过 15.1%</text>
    <rect x="320" y="344" width="11" height="11" fill="#afb8c1"/>
    <text x="337" y="354">没打分 8.3%</text>
    <text x="440" y="354">前三项相加 = 34.3%。编译检查不需要 GPU，收益最稳；Jev 的收益分书波动大（500 率 0%–40%）。</text>
  </g>
</svg>
