[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pmocr"
version = "0.3.0"
description = "扫描 PDF → Markdown 全流程：PDF 渲页、MiniCPM-OCR 解析、Jev 公式复核、合并成稿，附对照组实验"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "Pillow>=10",
    "PyMuPDF>=1.24",
]

[project.scripts]
pmocr = "pmocr.cli:main"

[tool.setuptools]
packages = ["pmocr"]

